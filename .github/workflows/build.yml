name: Build MOVIE Z

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleStableRelease
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOVIE-Z-APK
          path: app/build/outputs/apk/prerelease/release/*.apk
